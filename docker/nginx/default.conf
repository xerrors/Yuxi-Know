server {
    listen 80;
    server_name localhost;

    # 增加客户端请求体大小限制
    client_max_body_size 20M;

    # 原生 error_log 无脱敏格式；认证错误只由安全 access_log 保留状态。
    location ^~ /api/auth/oidc/callback {
        set $oidc_callback_path /api/auth/oidc/callback;
        access_log /var/log/nginx/access.log oidc_callback;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        error_log /dev/null;
        proxy_pass http://api:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /auth/oidc/callback {
        set $oidc_callback_path /auth/oidc/callback;
        access_log /var/log/nginx/access.log oidc_callback;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        error_log /dev/null;
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:5050/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # SSE/流式响应支持
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 增加超时时间（上传和流式响应）
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    # Public 创建与消息事件承载内联 base64 图片，单条消息最多 10 张、80 MiB。
    # 请求体放宽到 100M；其他 /api/ 请求仍受 20M 限制。
    # 正则 location 保留原 URI，必须显式写全代理与流式设置。
    location ~ ^/api/v1/agents/sessions(/[^/]+/events)?$ {
        client_max_body_size 100M;
        proxy_pass http://api:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # SSE/流式响应支持
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    location /minio/public/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://minio:9000/public/;
        proxy_set_header Host minio:9000;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
    }

    location /minio/ {
        return 404;
    }
}
