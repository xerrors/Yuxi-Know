user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 模块 Worker 要求 JavaScript MIME；基础镜像 mime.types 未映射 .mjs。
    types {
        application/javascript mjs;
    }

    map $http_referer $safe_referer {
        default $http_referer;
        ~/(api/)?auth/oidc/ "-";
        ~/api/system/mcp-servers/oauth/ "-";
        ~/extensions "-";
    }

    # 归一化后的 callback location 指定固定路径，原始 URI 不参与认证日志。
    log_format oauth_callback '$remote_addr - $remote_user [$time_local] '
                              '"$request_method $oauth_callback_path $server_protocol" '
                              '$status $body_bytes_sent "-" '
                              '"$http_user_agent" "$http_x_forwarded_for"';

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$safe_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
