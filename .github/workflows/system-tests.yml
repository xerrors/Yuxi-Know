name: Runtime System Tests

on:
  pull_request:
    paths:
      - '.env.template'
      - 'backend/yuxi/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'backend/test/integration/**'
      - 'backend/test/e2e/**'
      - 'backend/test/support/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'scripts/ci_prepare_system_tests_env.sh'
      - 'scripts/ci_build_topology_images.sh'
      - '.github/workflows/system-tests.yml'
  push:
    tags: ['v[0-9]*']
    branches: [main, develop/1.0]
    paths:
      - '.env.template'
      - 'backend/yuxi/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'backend/test/integration/**'
      - 'backend/test/e2e/**'
      - 'backend/test/support/**'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'scripts/ci_prepare_system_tests_env.sh'
      - 'scripts/ci_build_topology_images.sh'
      - '.github/workflows/system-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET_KEY: ci-jwt-secret-at-least-thirty-two-characters
  API_KEY_DERIVATION_SECRET: ci-api-key-derivation-secret-at-least-32-chars
  SANDBOX_PROVISIONER_TOKEN: ci-sandbox-token-at-least-thirty-two-characters
  E2E_USERNAME: ci_e2e_admin
  E2E_PASSWORD: ci-e2e-password-at-least-eight

jobs:
  # 后台作业 验证与主链路互斥（会停 api/worker 并强制重建 Milvus），
  # 单独成 job 与主链路并行；两个 job 共享层缓存，各自持有完整拓扑。
  background-job-worker-path:
    name: 后台作业 worker path
    runs-on: ubuntu-latest
    # 与主链路相同：冷缓存构建（含 provisioner Debian/Python 下载）叠加 Milvus 拓扑热身，预算需覆盖最慢真实构建。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare Compose environment
        run: bash scripts/ci_prepare_system_tests_env.sh
      - name: Restore api image layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/yuxi-buildkit-cache/api
          key: buildkit-api-${{ runner.os }}-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml', 'docker/api.Dockerfile') }}
          restore-keys: |
            buildkit-api-${{ runner.os }}-
      - name: Restore sandbox-provisioner image layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/yuxi-buildkit-cache/sandbox-provisioner
          key: buildkit-sandbox-provisioner-${{ runner.os }}-${{ hashFiles('docker/sandbox_provisioner/requirements.txt', 'docker/sandbox_provisioner/Dockerfile') }}
          restore-keys: |
            buildkit-sandbox-provisioner-${{ runner.os }}-
      - name: Restore minio image layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/yuxi-buildkit-cache/minio
          key: buildkit-minio-${{ runner.os }}-${{ hashFiles('docker/minio/Dockerfile', 'docker/minio/docker-entrypoint.sh') }}
          restore-keys: |
            buildkit-minio-${{ runner.os }}-
      - name: Build topology images with cached layers
        run: bash scripts/ci_build_topology_images.sh /tmp/yuxi-buildkit-cache/api /tmp/yuxi-buildkit-cache/sandbox-provisioner /tmp/yuxi-buildkit-cache/minio
      - name: Prepare isolated storage for runtime identity
        run: |
          docker compose run --rm --no-deps --user 0:0 api \
            install -d -o 1000 -g 1000 -m 0700 /app/user-data /app/skill-sources /app/skill-projections
      - name: Start background-job runtime topology
        run: docker compose up -d postgres redis minio etcd milvus sandbox-provisioner api worker
      - name: Wait for background-job topology readiness
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T milvus curl -fsS http://localhost:9091/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose logs etcd minio milvus --tail 200
              exit 1
            fi
            sleep 2
          done
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:5050/api/system/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api worker --tail 200
          exit 1
      - name: Initialize isolated E2E administrator
        run: |
          curl -fsS -X POST http://localhost:5050/api/auth/initialize \
            -H 'Content-Type: application/json' \
            --data "{\"uid\":\"${E2E_USERNAME}\",\"password\":\"${E2E_PASSWORD}\"}" >/dev/null
      - name: Verify 后台作业 worker path
        run: |
          docker compose stop api worker
          docker compose run --rm schema-init
          docker compose run --rm --no-deps api \
            uv run --no-sync --no-dev pytest test/integration/services/test_background_job_repository.py -q
          docker compose run --rm --no-deps \
            -e BACKGROUND_JOB_GATE_ID=${{ github.run_id }} api \
            uv run --no-sync --no-dev pytest \
              test/integration/services/test_background_job_worker_path.py::test_prepare_job_with_failed_initial_arq_publication -q
          docker compose up -d --force-recreate milvus api worker
          for attempt in $(seq 1 60); do
            if docker compose exec -T milvus curl -fsS http://localhost:9091/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose logs etcd minio milvus --tail 200
              exit 1
            fi
            sleep 2
          done
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:5050/api/system/ready >/dev/null; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker compose logs api worker --tail 200
              exit 1
            fi
            sleep 2
          done
          docker compose exec -T -e BACKGROUND_JOB_GATE_ID=${{ github.run_id }} api \
            uv run --no-sync --no-dev pytest \
              test/integration/services/test_background_job_worker_path.py::test_shipping_worker_startup_recovers_pending_publication -q
          docker compose exec -T -e BACKGROUND_JOB_GATE_ID=${{ github.run_id }} api \
            uv run --no-sync --no-dev pytest \
              test/integration/services/test_background_job_worker_path.py::test_shipping_worker_failure_runs_domain_hook -q
          docker compose exec -T \
            -e TEST_USERNAME=${E2E_USERNAME} \
            -e TEST_PASSWORD=${E2E_PASSWORD} api \
            uv run --no-sync --no-dev pytest \
              test/integration/api/test_background_jobs_router.py::test_enqueue_document_creates_job -q
      - name: Runtime logs on failure
        if: failure() || cancelled()
        run: docker compose logs api worker --tail 300
      - name: Stop runtime topology
        if: always()
        run: docker compose down -v

  system-tests:
    name: PostgreSQL, readiness and Agent lifecycle
    runs-on: ubuntu-latest
    # 新 runner 首次构建 sandbox-provisioner 会下载 Debian 与 Python 依赖，启动预算需覆盖冷缓存构建。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Prepare Compose environment
        run: bash scripts/ci_prepare_system_tests_env.sh
      - name: Restore api image layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/yuxi-buildkit-cache/api
          key: buildkit-api-${{ runner.os }}-${{ hashFiles('backend/uv.lock', 'backend/pyproject.toml', 'docker/api.Dockerfile') }}
          restore-keys: |
            buildkit-api-${{ runner.os }}-
      - name: Restore sandbox-provisioner image layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/yuxi-buildkit-cache/sandbox-provisioner
          key: buildkit-sandbox-provisioner-${{ runner.os }}-${{ hashFiles('docker/sandbox_provisioner/requirements.txt', 'docker/sandbox_provisioner/Dockerfile') }}
          restore-keys: |
            buildkit-sandbox-provisioner-${{ runner.os }}-
      - name: Restore minio image layer cache
        uses: actions/cache@v4
        with:
          path: /tmp/yuxi-buildkit-cache/minio
          key: buildkit-minio-${{ runner.os }}-${{ hashFiles('docker/minio/Dockerfile', 'docker/minio/docker-entrypoint.sh') }}
          restore-keys: |
            buildkit-minio-${{ runner.os }}-
      - name: Build topology images with cached layers
        run: bash scripts/ci_build_topology_images.sh /tmp/yuxi-buildkit-cache/api /tmp/yuxi-buildkit-cache/sandbox-provisioner /tmp/yuxi-buildkit-cache/minio
      # 冷 runner 的镜像下载属于环境准备，不能消耗单个 Run 的执行预算。
      - name: Pull sandbox runtime image before timed E2E runs
        run: |
          sandbox_runtime_image=$(docker compose config --format json | python3 -c 'import json, sys; print(json.load(sys.stdin)["services"]["sandbox-provisioner"]["environment"]["SANDBOX_IMAGE"])')
          docker pull "$sandbox_runtime_image"
      - name: Prepare isolated storage for runtime identity
        run: |
          docker compose run --rm --no-deps --user 0:0 api \
            install -d -o 1000 -g 1000 -m 0700 /app/user-data /app/skill-sources /app/skill-projections
      - name: Start focused runtime topology
        run: docker compose up -d postgres redis minio milvus graph sandbox-provisioner api worker
      - name: Wait for Milvus retrieval readiness
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T milvus curl -fsS http://localhost:9091/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs etcd minio milvus --tail 200
          exit 1
      - name: Wait for truthful readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:5050/api/system/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs api worker sandbox-provisioner --tail 200
          exit 1
      - name: Initialize isolated E2E administrator
        run: |
          curl -fsS -X POST http://localhost:5050/api/auth/initialize \
            -H 'Content-Type: application/json' \
            --data "{\"uid\":\"${E2E_USERNAME}\",\"password\":\"${E2E_PASSWORD}\"}" >/dev/null
      - name: Start deterministic OpenAI-compatible replay
        run: |
          docker compose exec -d api uv run --no-sync --no-dev python test/support/openai_replay_server.py
          docker compose exec -d api uv run --no-sync --no-dev python -m test.support.cooperation_replay_server
          for attempt in $(seq 1 20); do
            if docker compose exec -T api curl -fsS http://localhost:8765/health >/dev/null && \
               docker compose exec -T api curl -fsS http://localhost:8766/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify worker shipping health
        run: docker compose exec -T worker uv run --no-sync --no-dev arq --check yuxi.workers.main.WorkerSettings
      - name: Verify local job filtering preserves ARQ dispatch and retry
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/services/test_arq_worker_dispatch.py -q
      - name: Verify worker can write personal Skill UserWorkspace
        run: |
          docker compose exec -T -e E2E_USERNAME worker uv run --no-sync --no-dev python - <<'PY'
          import os
          from pathlib import Path

          skill_root = Path("/app/user-data/shared") / os.environ["E2E_USERNAME"] / "workspace/agents/skills"
          skill_root.mkdir(parents=True, exist_ok=True)
          probe = skill_root / ".worker-write-probe"
          try:
              probe.write_text("worker-write-ok", encoding="utf-8")
              assert probe.read_text(encoding="utf-8") == "worker-write-ok"
          finally:
              probe.unlink(missing_ok=True)
          PY
      - name: Verify worker health leases are expiring runtime facts
        run: |
          worker_ttl=$(docker compose exec -T redis redis-cli PTTL yuxi:worker:health:agent-run-v1)
          reconciliation_ttl=$(docker compose exec -T redis redis-cli PTTL yuxi:worker:health:agent-run-v1:lease-reconciliation)
          test "$worker_ttl" -gt 0 && test "$worker_ttl" -le 6000
          test "$reconciliation_ttl" -gt 0 && test "$reconciliation_ttl" -le 65000
      - name: Verify dead worker removes API readiness
        run: |
          docker compose pause worker
          cleanup() { docker compose unpause worker >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          not_ready=false
          for attempt in $(seq 1 15); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:5050/api/system/ready)
            if [ "$status" = "503" ]; then
              not_ready=true
              break
            fi
            sleep 1
          done
          test "$not_ready" = true
          cleanup
          trap - EXIT
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:5050/api/system/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify readiness API
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/api/test_system_router_api.py::test_health_endpoint_is_public test/integration/api/test_system_router_api.py::test_readiness_endpoint_proves_core_runtime_dependencies test/integration/api/test_system_router_api.py::test_discovery_and_openapi_declare_full_knowledge_capabilities -q
      - name: Verify MCP management connection contract
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/api/test_mcp_router.py -q
      - name: Verify knowledge MCP authentication and persisted documents
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/api/test_knowledge_mcp.py -q
      - name: Verify module failure and permission boundaries
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/api/test_module_failure_boundaries.py -q
      - name: Verify chunk configuration before persistence and job registration
        run: docker compose exec -T -e TEST_USERNAME= -e TEST_PASSWORD= api uv run --no-sync --no-dev pytest test/integration/services/test_chunk_config_boundary.py -q
      - name: Verify roles, grants and private Agent HTTP boundaries
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/api/test_permission_convergence.py test/integration/identity/test_identity_permission_constraints.py -q
      - name: Verify private owner fields and shared manager resource patches
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/api/test_agent_config_resource_authorization.py -q
      - name: Verify permission revocation through worker
        run: docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest test/e2e/test_permission_revocation_e2e.py -q
      - name: Verify Skill content commits and Agent exclusive history HTTP boundaries
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/api/test_agent_bound_skill.py test/integration/api/test_shared_skill_edit_router.py -q
      - name: Verify exclusive Skill preload and restore through worker
        run: docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest test/e2e/test_agent_bound_skill_e2e.py -q
      - name: Verify atomic Agent creation with Skill and MCP
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/api/test_agent_create_resources.py -q
      - name: Verify current Schema initialization contract
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/services/test_schema_migration_version.py -q
      - name: Verify fresh relations, indexes and knowledge cleanup negative controls
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/services/test_knowledge_projection_integrity.py test/integration/services/test_database_relation_integrity.py test/integration/services/test_database_access_paths.py -q
      - name: Verify Milvus 3 text retrieval through worker
        run: docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest test/e2e/test_milvus_text_retrieval_e2e.py -q --durations=10
      - name: Verify knowledge statistics projection
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/services/test_knowledge_stats_refresh.py -q
      - name: Verify Input FIFO transaction and recovery
        run: docker compose exec -T -e TEST_BASE_URL=http://127.0.0.1:1 -e SANDBOX_PROVISIONER_URL=http://127.0.0.1:1 -e SANDBOX_PROVISIONER_TOKEN=fixture-probe-not-used-sandbox-token -e TEST_USERNAME=fixture-probe -e TEST_PASSWORD=fixture-probe api uv run --no-sync --no-dev pytest test/integration/services/test_agent_input_concurrency.py test/integration/services/test_thread_priority_inputs.py test/integration/services/test_input_attachments.py test/integration/services/test_session_title_generation.py -q
      - name: Verify Run lease ownership
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/services/test_agent_run_lease.py -q
      - name: Verify Turn result causality
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/api/test_turn_result_causality.py -q
      - name: Verify feedback persistence and execution boundary
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/services/test_agent_feedback.py -q
      - name: Verify feedback HTTP access and worker collection
        timeout-minutes: 5
        run: |
          docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/api/test_agent_feedback_api.py -q
          docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest test/e2e/test_agent_feedback_e2e.py -q
      - name: Verify lifecycle HTTP and PostgreSQL boundaries
        timeout-minutes: 8
        run: |
          docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api \
            uv run --no-sync --no-dev pytest \
            test/integration/api/test_chat_router.py::test_public_thread_endpoints_require_authentication \
            test/integration/api/test_chat_router.py::test_public_create_rejects_empty_input \
            test/integration/api/test_chat_router.py::test_public_missing_thread_and_turn_return_not_found \
            test/integration/api/test_chat_router.py::test_public_input_rejects_unbound_attachment_without_persisting_receipt \
            test/integration/api/test_removed_api_endpoints.py::test_removed_agent_session_entrypoints_are_unreachable \
            test/integration/api/test_public_agents_key_boundary.py \
            test/integration/services/test_agent_input_schema.py \
            test/integration/services/test_project_thread_archive.py \
            test/integration/services/test_run_stream_redis.py -q
      - name: Verify Knowledge Key HTTP boundary without optional knowledge runtime
        run: |
          docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api \
            uv run --no-sync --no-dev pytest \
            test/integration/api/test_public_knowledge_tools.py::test_knowledge_key_tool_route_boundary_without_kb \
            test/integration/api/test_public_knowledge_tools.py::test_agents_key_cannot_access_public_knowledge_api \
            test/integration/api/test_removed_api_endpoints.py::test_public_knowledge_does_not_expose_management_routes -q
      - name: Verify Session tree recovery and visibility
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/api/test_session_cooperation_state_recovery.py -q
      - name: Verify Message audit HTTP contract
        timeout-minutes: 3
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/api/test_chat_router.py::test_thread_message_audits_return_persisted_facts_without_leaking_into_history test/integration/api/test_chat_router.py::test_debug_messages_follow_database_sequence_and_include_unassigned_inputs -q --setup-show -o faulthandler_timeout=60
      - name: Verify visible tools for ordinary users
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/e2e/test_agent_lifecycle_extended_e2e.py::test_standard_user_restores_visible_function_items_without_internal_audit -q
      - name: Verify Session cooperation persistence and capacity
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/services/test_session_cooperation.py -q
      - name: Verify attachment HTTP and object contract
        timeout-minutes: 3
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/api/test_chat_router.py::test_thread_artifact_uses_image_signature_for_content_type test/integration/api/test_public_agent_files.py -q
      - name: Verify Input, Turn and Run lifecycle through worker
        timeout-minutes: 20
        run: docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest test/e2e/test_agent_lifecycle_e2e.py test/e2e/test_input_projection_recovery_e2e.py test/e2e/test_draft_attachments_e2e.py -q --durations=10
      - name: Verify scheduled, model and tool lifecycle paths
        timeout-minutes: 12
        run: docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest test/e2e/test_agent_lifecycle_extended_e2e.py -q --durations=10
      - name: Verify Session cooperation and Workdir boundaries
        timeout-minutes: 12
        run: docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest test/e2e/test_session_cooperation_e2e.py -q --durations=10
      - name: Verify Agents Key end-user execution scope
        timeout-minutes: 6
        run: docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest test/e2e/test_agent_lifecycle_key_scope_e2e.py -q --durations=10
      - name: Verify OpenAI events default input and recovery
        run: docker compose exec -T -e E2E_USERNAME -e E2E_PASSWORD api uv run --no-sync --no-dev pytest test/e2e/test_openai_events_e2e.py -q --durations=10
      - name: Verify identity transaction and replayable secret publication
        run: docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest test/integration/services/test_identity_admin_service.py test/integration/services/test_api_key_user_lifecycle.py test/integration/api/test_apikey_router.py -q
      - name: Verify atomic OIDC login on isolated PostgreSQL schema
        run: docker compose exec -T -e TEST_USERNAME= -e TEST_PASSWORD= api uv run --no-sync --no-dev pytest test/integration/services/test_oidc_login_transaction.py -q
      - name: Verify OIDC callback proxy log and cache boundaries
        run: python3 scripts/verify_oidc_proxy.py
      - name: Verify password login state and HTTP contract
        run: docker compose exec -T -e TEST_USERNAME= -e TEST_PASSWORD= api uv run --no-sync --no-dev pytest test/integration/services/test_password_login_boundary.py -q
      - name: Verify Workdir and Skill authorization
        run: |
          docker compose exec -T -e TEST_USERNAME="$E2E_USERNAME" -e TEST_PASSWORD="$E2E_PASSWORD" api uv run --no-sync --no-dev pytest \
            test/integration/services/test_project_workdir_provisioner.py::test_sessions_share_workdir_only_through_project \
            test/integration/services/test_user_skill_projection.py \
            test/integration/api/test_skill_artifact_authorization.py -q
      - name: Verify real Sandbox storage isolation and shared projections
        run: docker compose exec -T api uv run --no-sync --no-dev pytest test/integration/services/test_project_workdir_provisioner.py -q
      - name: Runtime logs on failure
        if: failure() || cancelled()
        run: docker compose logs api worker sandbox-provisioner --tail 300
      - name: Stop runtime topology
        if: always()
        run: docker compose down -v
