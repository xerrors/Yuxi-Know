# 后端单元测试 CI：此前后端 pytest 从未接入 CI，改动回归无人把关。
# 本工作流在 push/PR 时运行 unit 层测试（不依赖 docker 服务）。
name: Backend Unit Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.env.template'
      - '.dockerignore'
      - 'backend/**'
      - 'backend/pyproject.toml'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'Makefile'
      - 'scripts/init.sh'
      - 'scripts/pull_image.sh'
      - 'scripts/test_docker_build_context.py'
      - 'scripts/test_container_permissions.py'
      - 'scripts/init.ps1'
      - 'scripts/test_init_security.ps1'
      - '.github/workflows/test.yml'
  push:
    tags: ['v[0-9]*']
    branches:
      - main
      - 'develop/**'
    paths:
      - '.env.template'
      - '.dockerignore'
      - 'backend/**'
      - 'backend/pyproject.toml'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - 'scripts/init.sh'
      - 'scripts/pull_image.sh'
      - 'scripts/test_docker_build_context.py'
      - 'scripts/test_container_permissions.py'
      - 'scripts/init.ps1'
      - 'scripts/test_init_security.ps1'
      - '.github/workflows/test.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify private files stay outside the Docker build context
        working-directory: .
        run: python3 -m unittest scripts.test_docker_build_context

      - name: Verify image and storage permissions
        working-directory: .
        run: python3 -m unittest scripts.test_container_permissions

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.6"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --group test

      - name: Run complete unit inventory
        run: uv run pytest test/unit -m 'not slow' -q

  powershell-security-contract:
    name: PowerShell security environment contract
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run native PowerShell security negative controls
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test_init_security.ps1
